<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// apply the theme before first paint: the saved choice, else light only in the
			// daytime (7am-6pm local) for visitors whose system isn't set to dark
			try {
				const h = new Date().getHours();
				const day = h >= 7 && h < 18 && !matchMedia("(prefers-color-scheme: dark)").matches;
				document.documentElement.dataset.theme = localStorage.getItem("tot-theme") || (day ? "light" : "dark");
			} catch (e) {}
		</script>
		<script async src="https://www.googletagmanager.com/gtag/js?id=G-XB09CWTEWB"></script>
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag(){dataLayer.push(arguments);}
			gtag('js', new Date());
			gtag('config', 'G-XB09CWTEWB');
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
